# Local development stack: PostgreSQL + FastAPI + Next.js.
#   cp .env.example .env   (optional; defaults below work for local use)
#   docker compose up --build
# Then open http://localhost:3000 and choose "Explore the synthetic demo project".
name: tracemind

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemind-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      TRACEMIND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracemind}:${POSTGRES_PASSWORD:-tracemind-local-only}@db:5432/${POSTGRES_DB:-tracemind}
      TRACEMIND_STORAGE_LOCAL_DIR: /data/uploads
      TRACEMIND_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  uploads:
