[project]
name = "tracemind-backend"
version = "1.0.0"
description = "TraceMind AI - evidence-driven incident investigation API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "B008",   # FastAPI dependency injection uses calls in defaults
    "S101",   # asserts in tests
    "S311",   # numpy RNG is for synthetic data, not crypto
    "SIM108",
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
