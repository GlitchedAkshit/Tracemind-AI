name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracemind
          POSTGRES_PASSWORD: tracemind
          POSTGRES_DB: tracemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracemind" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Unit and API tests (SQLite)
        run: pytest -q
      - name: Migrations against PostgreSQL
        env:
          TRACEMIND_DATABASE_URL: postgresql+psycopg://tracemind:tracemind@localhost:5432/tracemind
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Benchmark smoke run
        run: python -m app.bench.runner --seed 42 --scenarios 3 --out /tmp/bench

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
